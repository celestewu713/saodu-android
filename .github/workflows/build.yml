name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: 還原簽章檔
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            # 去掉貼上時可能多出的空白或換行
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/saodu.keystore"
            echo "簽章檔大小：$(wc -c < "$RUNNER_TEMP/saodu.keystore") bytes，指紋前 16 碼：$(sha256sum "$RUNNER_TEMP/saodu.keystore" | cut -c1-16)"
            PW="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if ! keytool -list -keystore "$RUNNER_TEMP/saodu.keystore" -storepass "$PW" -alias saodu > /dev/null 2>&1; then
              echo "::error::簽章檔或密碼不正確：請重新複製 Android簽章資料.txt 裡的兩個值到 GitHub Secrets。"
              exit 1
            fi
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/saodu.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::沒有設定 SIGNING_KEYSTORE_BASE64，這次改用臨時簽章。"
          fi

      - name: 打包
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: 整理安裝檔
        run: cp app/build/outputs/apk/release/app-release.apk saodu.apk

      - name: 發布到「最新版本」頁面
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest saodu.apk \
            --title "掃毒小幫手 最新版" \
            --notes "用手機打開這一頁，點下方的 saodu.apk 下載並安裝。（版本：${GITHUB_SHA::7}）"
