name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 還原簽章檔
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/saodu.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/saodu.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::沒有設定 SIGNING_KEYSTORE_BASE64，這次改用臨時簽章。"
          fi

      - name: 打包
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: 整理安裝檔
        run: cp app/build/outputs/apk/release/app-release.apk saodu.apk

      - name: 發布到「最新版本」頁面
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest saodu.apk \
            --title "掃毒小幫手 最新版" \
            --notes "用手機打開這一頁，點下方的 saodu.apk 下載並安裝。（版本：${GITHUB_SHA::7}）"
